name: soundverse  # 🚀 这行能彻底解决容器名带随机 ID 的问题

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: soundverse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: soundverse
      MYSQL_USER: soundverse
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - soundverse-network
    restart: always  # 🚀 确保数据库永远在线

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: soundverse-redis
    ports:
      - "63792:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soundverse-network
    restart: always

  # 后端API服务
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: soundverse-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - AUTH_MODE=jwt
      - DATABASE_URL=mysql+aiomysql://soundverse:password@mysql:3306/soundverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MAX_SEGMENT_DURATION=8.0
      - MIN_SEGMENT_DURATION=2.0
      - SIMILARITY_THRESHOLD=0.48
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - backend/logs/
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # 确保有 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - soundverse-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: soundverse-celery-worker
    depends_on:
      - redis
      - mysql
    environment:
      - ENVIRONMENT=development
      - AUTH_MODE=jwt
      - DATABASE_URL=mysql+aiomysql://soundverse:password@mysql:3306/soundverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MAX_SEGMENT_DURATION=8.0
      - MIN_SEGMENT_DURATION=2.0
      - SIMILARITY_THRESHOLD=0.48
      - PYTHONUNBUFFERED=1
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
    # 使用热重载启动脚本
    command: python celery_worker_reload.py
    networks:
      - soundverse-network
    restart: unless-stopped

  # Celery Beat (定时任务)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: soundverse-celery-beat
    depends_on:
      - redis
      - mysql
    environment:
      - ENVIRONMENT=development
      - AUTH_MODE=jwt
      - DATABASE_URL=mysql+aiomysql://soundverse:password@mysql:3306/soundverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MAX_SEGMENT_DURATION=8.0
      - MIN_SEGMENT_DURATION=2.0
      - SIMILARITY_THRESHOLD=0.48
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: celery -A tasks.celery_app beat --loglevel=info
    networks:
      - soundverse-network
    restart: unless-stopped

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: soundverse-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./backend/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - soundverse-network
    restart: unless-stopped

  # Auto Ingest Service - 本地音频自动入库
  auto-ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: soundverse-auto-ingest
    command: python -m scripts.auto_ingest /app/data/auto_import --interval 30 --on-complete move --max-concurrent 2
    volumes:
      - ./backend:/app
      - ./backend/data/auto_import:/app/data/auto_import
      - ./backend/logs:/app/logs
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://soundverse:password@mysql:3306/soundverse
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    networks:
      - soundverse-network
    restart: unless-stopped

  # Frontend Demo UI
  frontend-demo:
    build:
      context: ./frontend-demo
      dockerfile: Dockerfile.dev
    container_name: soundverse-frontend-demo
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-demo/src:/app/src
      - ./frontend-demo/public:/app/public
      - ./frontend-demo/index.html:/app/index.html
      - ./frontend-demo/vite.config.ts:/app/vite.config.ts
      - ./frontend-demo/package.json:/app/package.json
      - ./frontend-demo/tsconfig.json:/app/tsconfig.json
      - ./frontend-demo/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend-demo/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend-demo/tailwind.config.js:/app/tailwind.config.js
      - ./frontend-demo/postcss.config.js:/app/postcss.config.js
      - ./frontend-demo/eslint.config.js:/app/eslint.config.js
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 5
    networks:
      - soundverse-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  frontend_node_modules:

networks:
  soundverse-network:
    driver: bridge