server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 支持前端路由（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点
    location = /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }
}