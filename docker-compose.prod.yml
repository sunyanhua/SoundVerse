version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: SoundVerse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: soundverse
      MYSQL_USER: soundverse
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: SoundVerse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # 后端API服务
  api:
    # image: soundverse-api:prod
    build: ./backend
    container_name: SoundVerse-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+aiomysql://soundverse:password@mysql:3306/soundverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - GUNICORN_WORKERS=2
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - SoundVerse-network

  # Celery Worker
  celery-worker:
    image: soundverse-api:prod
    container_name: SoundVerse-celery-worker
    depends_on:
      - redis
      - mysql
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - ./.env
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # Celery Beat
  celery-beat:
    image: soundverse-api:prod
    container_name: SoundVerse-celery-beat
    depends_on:
      - redis
      - mysql
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - ./.env
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # 前端
  frontend-demo:
    image: soundverse-frontend:prod
    container_name: SoundVerse-frontend-demo
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=https://soundverse.vbegin.com.cn
    restart: unless-stopped
    networks:
      - SoundVerse-network

volumes:
  mysql_data:
  redis_data:

networks:
  SoundVerse-network:
    driver: bridge