version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: SoundVerse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: soundverse
      MYSQL_USER: soundverse
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: SoundVerse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # 后端API服务
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: SoundVerse-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+aiomysql://soundverse:password@mysql:3306/soundverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - backend/logs/
            - __pycache__/
            - "*.pyc"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - SoundVerse-network

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: SoundVerse-celery-worker
    depends_on:
      - redis
      - mysql
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # Celery Beat
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: SoundVerse-celery-beat
    depends_on:
      - redis
      - mysql
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - SoundVerse-network

  # 前端
  frontend-demo:
    build:
      context: ./frontend-demo
      dockerfile: Dockerfile.dev
    container_name: SoundVerse-frontend-demo
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-demo/src:/app/src
      - ./frontend-demo/public:/app/public
      - ./frontend-demo/index.html:/app/index.html
      - ./frontend-demo/vite.config.ts:/app/vite.config.ts
      - ./frontend-demo/package.json:/app/package.json
      - ./frontend-demo/tsconfig.json:/app/tsconfig.json
      - ./frontend-demo/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend-demo/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend-demo/tailwind.config.js:/app/tailwind.config.js
      - ./frontend-demo/postcss.config.js:/app/postcss.config.js
      - ./frontend-demo/eslint.config.js:/app/eslint.config.js
      - ./frontend-demo/.env:/app/.env
    environment:
      - NODE_ENV=development
      - VITE_APP_MODE=demo
    develop:
      watch:
        - action: sync
          path: ./frontend-demo/src
          target: /app/src
    restart: unless-stopped
    networks:
      - SoundVerse-network

volumes:
  mysql_data:
  redis_data:

networks:
  SoundVerse-network:
    driver: bridge